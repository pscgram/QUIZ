services:
  - type: web
    name: pscgram-creator-bot
    runtime: python
    plan: free
    rootDir: extracted_files/Quizbot-main
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py --only creator
    healthCheckPath: /healthz
    envVars:
      - key: CREATOR_BOT_TOKEN
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: quizbot
      - key: OWNER_ID
        sync: false
      - key: ADMIN_IDS
        sync: false

  - type: web
    name: pscgram-player-bot
    runtime: python
    plan: free
    rootDir: extracted_files/Quizbot-main
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py --only runner
    healthCheckPath: /healthz
    envVars:
      - key: RUNNER_BOT_TOKEN
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: quizbot
      - key: OWNER_ID
        sync: false
      - key: ADMIN_IDS
        sync: false
