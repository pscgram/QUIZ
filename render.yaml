services:
  - type: web
    name: pscgram-quizbot
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: CREATOR_BOT_TOKEN
        sync: false
      - key: RUNNER_BOT_TOKEN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: quizbot
      - key: OWNER_ID
        sync: false
