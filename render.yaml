services:
  - type: web
    name: pscgram-quiz
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /healthz

    envVars:
      - key: CREATOR_BOT_TOKEN
        sync: false

      - key: RUNNER_BOT_TOKEN
        sync: false

      - key: API_ID
        sync: false

      - key: API_HASH
        sync: false

      - key: MONGODB_URI
        sync: false

      - key: MONGODB_DB_NAME
        value: quizbot

      - key: OWNER_ID
        sync: false

      - key: ADMIN_IDS
        sync: false
