services:
  - type: web
    name: pscgram-quizbot
    runtime: python
    plan: free
    rootDir: extracted_files/Quizbot-main
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: CREATOR_BOT_TOKEN
        sync: false
      - key: RUNNER_BOT_TOKEN
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: quizbot
      - key: OWNER_ID
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: FREE_BOT
        value: "True"
