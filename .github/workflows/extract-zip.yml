
name: Extract PSCGram ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip -o PSCGram_Quizbot_Render_Ready.zip -d extracted

      - name: Copy project files to root
        run: |
          cp -a extracted/PSCGram_Quizbot_Render_Ready/. .
          rm -rf extracted
          rm -f PSCGram_Quizbot_Render_Ready.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract PSCGram Quizbot project" || echo "No changes"
          git push
