
name: Extract ZIP to Repository Root

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract latest uploaded ZIP into root
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found."
            exit 1
          fi

          echo "Using archive: $ZIP_FILE"

          export ZIP_FILE

          python - <<'PY'
          import os
          import zipfile
          import tempfile
          from pathlib import Path

          repo = Path.cwd()
          archive = Path(os.environ["ZIP_FILE"])

          with tempfile.TemporaryDirectory() as temp:
              temp = Path(temp)
              extracted = temp / "unpacked"
              extracted.mkdir()

              with zipfile.ZipFile(archive) as z:
                  for member in z.infolist():
                      path = Path(member.filename)
                      if path.is_absolute() or ".." in path.parts:
                          raise RuntimeError(f"Unsafe ZIP path: {member.filename}")
                  z.extractall(extracted)

              candidates = [
                  p.parent for p in extracted.rglob("run.py")
                  if (p.parent / "quizbot").is_dir()
              ]

              if not candidates:
                  raise RuntimeError("Could not find project folder containing run.py and quizbot/")

              source = candidates[0]
              print(f"Project root found: {source}")

              for item in source.iterdir():
                  if item.name in (".git", ".github"):
                      continue
                  if item.suffix.lower() == ".zip":
                      continue

                  target = repo / item.name

                  if item.is_dir():
                      import shutil
                      shutil.copytree(item, target, dirs_exist_ok=True)
                  else:
                      import shutil
                      shutil.copy2(item, target)

              print("Project files copied to repository root.")
          PY

          rm -rf extracted_files

      - name: Verify root project
        run: |
          test -f run.py
          test -d quizbot
          test -f requirements.txt
          echo "Root project verified:"
          ls -la

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract updated PSCGram project to root"
            git push
          fi
