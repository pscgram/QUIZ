name: Extract ZIP Files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -type f -name "*.zip" -not -path "./.git/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository."
            echo "Upload your ZIP file to the repository first."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          DEST="extracted_files"
          mkdir -p "$DEST"

          unzip -o "$ZIP_FILE" -d "$DEST"

          echo "Extraction complete."
          find "$DEST" -type f

      - name: Commit extracted files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add extracted_files

          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
          else
            git commit -m "Extract ZIP contents"
            git push
          fi
